name: Build and publish macOS update

on:
  push:
    branches: [main]
    paths: [Packaging/ReleaseVersion.json]
  workflow_dispatch:
    inputs:
      version:
        description: Public version, for example 0.6.1
        required: true
      build_number:
        description: Increasing integer build number
        required: true

permissions:
  contents: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Resolve explicit release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_BUILD: ${{ inputs.build_number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION=$(jq -er '.version | strings' Packaging/ReleaseVersion.json)
            BUILD=$(jq -er '.build_number | numbers | tostring' Packaging/ReleaseVersion.json)
          else
            VERSION="$REQUESTED_VERSION"
            BUILD="$REQUESTED_BUILD"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          [[ "$BUILD" =~ ^[1-9][0-9]*$ ]] || exit 2
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"

      - name: Reject duplicate or non-increasing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > /tmp/previous-release.json
          PREVIOUS_TAG=$(jq -er '.tag_name' /tmp/previous-release.json)
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir /tmp/previous-appcast
          PREVIOUS_BUILD=$(xmllint --xpath 'string(//*[local-name()="item"]/*[local-name()="version"])' /tmp/previous-appcast/appcast.xml)
          [[ "$PREVIOUS_BUILD" =~ ^[1-9][0-9]*$ ]] || exit 2
          (( APP_BUILD_NUMBER > PREVIOUS_BUILD )) || { echo 'Build number must increase'; exit 2; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$APP_VERSION" > /dev/null 2>&1; then
            echo 'Version tag already exists; existing releases are never overwritten.'
            exit 2
          fi

      - name: Prepare pinned binary dependencies
        run: zsh scripts/setup_dependencies.sh

      - name: Run unit tests
        env:
          SUBBUDDY_BUNDLED_MEDIA_TESTS: "1"
        # Exercise the actual stripped-down tools, not a system FFmpeg build.
        run: |
          zsh scripts/build_ffmpeg_macos.sh
          swift test --disable-sandbox

      - name: Validate release inputs and signing secret
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid version: $APP_VERSION" >&2
            exit 2
          }
          [[ "$APP_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "Build number must be a positive integer" >&2
            exit 2
          }
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || {
            echo "Missing repository secret: SPARKLE_PRIVATE_KEY" >&2
            exit 2
          }

      - name: Build Universal 2 DMG
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: zsh scripts/package_dmg.sh

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          RELEASE_TAG="v$APP_VERSION"
          mkdir -p "outputs/release-$APP_VERSION"
          ditto "outputs/Sub Buddy-$APP_VERSION.dmg" "outputs/release-$APP_VERSION/Sub-Buddy-$APP_VERSION.dmg"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | Vendor/Tools/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
            --link "https://github.com/$GITHUB_REPOSITORY" \
            --maximum-versions 1 \
            "outputs/release-$APP_VERSION"
          grep -q 'sparkle:edSignature=' "outputs/release-$APP_VERSION/appcast.xml"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="docs/releases/$APP_VERSION.md"
          if [[ -f "$NOTES_FILE" ]]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--generate-notes)
          fi
          gh release create "v$APP_VERSION" \
            "outputs/release-$APP_VERSION/Sub-Buddy-$APP_VERSION.dmg" \
            "outputs/release-$APP_VERSION/appcast.xml" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sub Buddy $APP_VERSION" \
            "${NOTES_ARGS[@]}"
